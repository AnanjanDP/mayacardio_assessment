# fly.toml app configuration file generated for Never Lose a Heartbeat Cloud API

app = "mayacardio-cloud-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1

[env]
  PORT = "8000"
  HOST = "0.0.0.0"
  LOG_LEVEL = "INFO"
