[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "never-lose-a-heartbeat"
version = "1.0.0"
description = "Fault-tolerant biosignal data pipeline on Raspberry Pi and free cloud infrastructure"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "httpx>=0.24.0",
    "psycopg2-binary>=2.9.0",
]

[project.scripts]
pipeline = "heartbeat.cli:main"
biosignal-mock = "mock.biosignal_mock:main"
check-ground-truth = "mock.check_ground_truth:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
